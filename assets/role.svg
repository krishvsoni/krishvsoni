<svg xmlns="http://www.w3.org/2000/svg" width="400" height="64" viewBox="200 0 400 64" role="img" aria-label="Building agents, infra. Backend engineer.">
  <defs>
    <style>@font-face{font-family:"InterSF";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}</style>
    <filter id="b0" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="14">
        <animate attributeName="stdDeviation" values="0;0;14;14;0" keyTimes="0;0.29;0.33;0.95;1" dur="12s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
    <filter id="b1" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="14">
        <animate attributeName="stdDeviation" values="14;14;0;0;14;14" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
    <filter id="b2" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="14">
        <animate attributeName="stdDeviation" values="14;14;0;0;14" keyTimes="0;0.66;0.7;0.95;1" dur="12s" repeatCount="indefinite"/>
      </feGaussianBlur>
    </filter>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', InterSF, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#8B949E">
    <text x="400" y="42" filter="url(#b0)" opacity="1">building agents
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.29;0.33;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" filter="url(#b1)" opacity="0">building infra
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.62;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="42" filter="url(#b2)" opacity="0">backend engineer
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.7;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
